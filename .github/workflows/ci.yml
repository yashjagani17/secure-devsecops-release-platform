name: CI Pipeline
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  code-test:
    name: Run application tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Run tests
        run: pytest

  code-scan:
    name: Run application vulnerability scans
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run code scan (fail on high/critical)
        uses: PyCQA/bandit-action@v1
        with:
          targets: 'app/'
          severity: 'medium'
          confidence: 'medium'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency scan (fail on vulnerability)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: app/requirements.txt

  docker-build-scan:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    needs: [code-test, code-scan]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t secure-devsecops-release-platform:${{ github.sha }} .
      - name: Docker image vulnerability scan (fail on critical/high)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'secure-devsecops-release-platform:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
      - name: Docker image vulnerability scan (warn on medium)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'secure-devsecops-release-platform:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'MEDIUM'
          trivyignores: '.trivyignore'
  docker-push:
    name: Push image to ghcr
    runs-on: ubuntu-latest
    needs: [docker-build-scan]
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to ghcr
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build image
      run: |
          docker build -t ghcr.io/yashjagani17/secure-devsecops-release-platform:${{ github.sha }} .
    - name: Tag image
      run: |
          docker tag ghcr.io/yashjagani17/secure-devsecops-release-platform:${{ github.sha }} ghcr.io/yashjagani17/secure-devsecops-release-platform:latest
    - name: Push image
      run: |
          docker push ghcr.io/yashjagani17/secure-devsecops-release-platform:${{ github.sha }}
          docker push ghcr.io/yashjagani17/secure-devsecops-release-platform:latest