name: CI Pipeline
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  code-test:
    name: Run application tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Run tests
        run: pytest
  code-scan:
    name: Run application vulnerability scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vulnerability scan dependencies
        run: pip install bandit pip-audit
      - name: Run code vulnerability scan
        run: bandit -r app/
      - name: Run dependency vulnerability scan
        run: pip-audit -r app/requirements.txt 
  docker-build-scan:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    needs: [code-test, code-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t secure-devsecops-release-platform:${{ github.sha }} .
      - name: Docker image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secure-devsecops-release-platform:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'