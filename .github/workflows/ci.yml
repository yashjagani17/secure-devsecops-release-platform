name: CI Pipeline
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  code-test:
    name: Run application tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Run tests
        run: pytest
  code-scan:
    name: Run application vulnerability scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run code scan (fail on high)
        uses: PyCQA/bandit-action@v1
        with:
          path: "app/"
          level: high
          confidence: medium
          exit_zero: false
      - name: Run code scan (warn on medium)
        if: always()
        uses: PyCQA/bandit-action@v1
        with:
          path: "app/"
          level: medium
          confidence: medium
          exit_zero: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency scan (fail on vulnerability)
        uses: pypa/gh-action-pip-audit@v1
        with:
          inputs: app/requirements.txt
  docker-build-scan:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    needs: [code-test, code-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t secure-devsecops-release-platform:${{ github.sha }} .
      - name: Docker image vulnerability scan (fail on critical/high)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secure-devsecops-release-platform:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
      - name: Docker image vulnerability scan (warn on medium)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secure-devsecops-release-platform:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'MEDIUM'
          trivyignores: '.trivyignore'